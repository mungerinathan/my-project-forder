<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free WiFi | Luxury Hotel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ===================== RESET ===================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            color: #2c3e50;
        }

        /* ===================== HEADER ===================== */
        .header {
            position: sticky;
            top: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.08);
            z-index: 1000;
        }

        .header .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 18px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #1e3c72;
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .logo i {
            font-size: 1.6rem;
            color: #2a5298;
        }

        .navbar ul {
            display: flex;
            align-items: center;
            gap: 28px;
            list-style: none;
        }

        .navbar ul li a {
            text-decoration: none;
            color: #47576e;
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.3s ease;
            position: relative;
        }

        .navbar ul li a:hover,
        .navbar ul li a.active {
            color: #2a5298;
        }

        .navbar ul li a.active::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 0;
            width: 100%;
            height: 2px;
            background: #2a5298;
            border-radius: 2px;
        }

        .navbar .btn-login,
        .navbar .btn-book {
            padding: 9px 22px;
            border-radius: 50px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .navbar .btn-login {
            border: 2px solid #2a5298;
            color: #2a5298 !important;
        }

        .navbar .btn-login:hover {
            background: #2a5298;
            color: #fff !important;
        }

        .navbar .btn-book {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: #fff !important;
            box-shadow: 0 6px 16px rgba(42, 82, 152, 0.3);
        }

        .navbar .btn-book:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 22px rgba(42, 82, 152, 0.4);
        }

        #menu-btn {
            display: none;
            background: none;
            border: none;
            font-size: 1.5rem;
            color: #1e3c72;
            cursor: pointer;
        }

        /* ===================== PAGE WRAP ===================== */
        .page-wrap {
            min-height: calc(100vh - 76px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        /* ===================== CARD ===================== */
        .card {
            background: #fff;
            max-width: 480px;
            width: 100%;
            padding: 60px 40px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.25);
            position: relative;
            overflow: hidden;
            animation: fadeUp 0.8s ease;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, #2a5298, #1e3c72);
        }

        .icon-wrap {
            width: 110px;
            height: 110px;
            margin: 0 auto 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, #eaf0fb, #d6e3f8);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .icon-wrap::after {
            content: '';
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            border: 2px dashed #b8cdf0;
            animation: spin 12s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .icon-wrap i {
            font-size: 48px;
            color: #2a5298;
        }

        .card h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #1e3c72;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .card p {
            font-size: 1rem;
            color: #6b7c93;
            font-weight: 300;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .details {
            background: #f5f8fd;
            border-radius: 14px;
            padding: 22px;
            margin-bottom: 28px;
            text-align: left;
        }

        .detail-row {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 0;
            border-bottom: 1px solid #e3ebf7;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-row i {
            color: #2a5298;
            font-size: 18px;
            width: 22px;
            text-align: center;
        }

        .detail-row span {
            font-size: 0.94rem;
            color: #47576e;
            font-weight: 400;
        }

        .detail-row strong {
            color: #1e3c72;
            font-weight: 600;
        }

        .btn {
            display: inline-block;
            width: 100%;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: #fff;
            padding: 15px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 500;
            font-size: 1rem;
            transition: all 0.3s ease;
            box-shadow: 0 10px 24px rgba(42, 82, 152, 0.35);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 14px 32px rgba(42, 82, 152, 0.45);
        }

        .btn i {
            margin-right: 8px;
        }

        /* ===================== RESPONSIVE ===================== */
        @media (max-width: 900px) {
            #menu-btn {
                display: block;
            }

            .navbar {
                position: absolute;
                top: 100%;
                left: 0;
                width: 100%;
                background: #fff;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
                max-height: 0;
                overflow: hidden;
                transition: max-height 0.4s ease;
            }

            .navbar.active {
                max-height: 500px;
            }

            .navbar ul {
                flex-direction: column;
                align-items: flex-start;
                gap: 0;
                padding: 10px 24px 20px;
            }

            .navbar ul li {
                width: 100%;
                padding: 12px 0;
                border-bottom: 1px solid #eef3fa;
            }

            .navbar ul li:last-child {
                border-bottom: none;
            }

            .navbar .btn-login,
            .navbar .btn-book {
                display: block;
                text-align: center;
            }
        }

        @media (max-width: 480px) {
            .card { padding: 45px 26px; }
            .card h1 { font-size: 1.6rem; }
            .icon-wrap { width: 90px; height: 90px; }
            .icon-wrap i { font-size: 38px; }
            .logo span { font-size: 1.1rem; }
        }
    </style>
</head>
<body>

    <!-- ===================== HEADER ===================== -->
    <header class="header">
        <div class="container">
            <a href="index.html" class="logo">
                <i class="fas fa-hotel"></i>
                <span>Luxury Hotel</span>
            </a>

            <nav class="navbar" id="navbar">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="room.html">Rooms</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html">Contact</a></li>
                    <li><a href="login.html" class="btn btn-login">Login</a></li>
                    <li><a href="booking.html" class="btn btn-book">Book</a></li>
                </ul>
            </nav>

            <button id="menu-btn">
                <i class="fas fa-bars"></i>
            </button>
        </div>
    </header>

    <!-- ===================== PAGE CONTENT ===================== -->
    <main class="page-wrap">
        <div class="card">
            <div class="icon-wrap">
                <i class="fas fa-wifi"></i>
            </div>

            <h1>Free WiFi</h1>
            <p>Stay connected with our high-speed internet — available everywhere, completely free.</p>

            <div class="details">
                <div class="detail-row">
                    <i class="fas fa-bolt"></i>
                    <span><strong>Speed:</strong> Up to 100 Mbps</span>
                </div>
                <div class="detail-row">
                    <i class="fas fa-shield-alt"></i>
                    <span><strong>Security:</strong> WPA3 Encrypted</span>
                </div>
                <div class="detail-row">
                    <i class="fas fa-clock"></i>
                    <span><strong>Availability:</strong> 24/7 Access</span>
                </div>
                <div class="detail-row">
                    <i class="fas fa-map-marker-alt"></i>
                    <span><strong>Coverage:</strong> All Rooms & Areas</span>
                </div>
            </div>

            <a href="#connect" class="btn">
                <i class="fas fa-plug"></i> Connect Now
            </a>
        </div>
    </main>

    <!-- ===================== SCRIPT ===================== -->
    <script>
        const menuBtn = document.getElementById('menu-btn');
        const navbar = document.getElementById('navbar');

        menuBtn.addEventListener('click', () => {
            navbar.classList.toggle('active');
        });
    </script>

</body>
</html>
